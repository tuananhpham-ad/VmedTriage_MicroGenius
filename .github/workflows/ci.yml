name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push liên tiếp lên cùng một PR: huỷ lượt chạy cũ, chỉ giữ lượt mới nhất.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      # KHÔNG đặt *_API_KEY giả ở đây. `_has_usable_key` (src/services/infra/llm.py) coi mọi chuỗi
      # khác placeholder là key thật, nên một key giả khiến test nào lỡ chạm tầng LLM sẽ gọi mạng
      # thật và fail kiểu treo/flaky, thay vì fail ngay với "thiếu API key". Runner cũng không có
      # `.env`, nên toàn bộ key rỗng - đúng trạng thái ta muốn kiểm: suite phải mock hết LLM.
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
